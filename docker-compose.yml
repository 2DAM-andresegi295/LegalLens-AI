services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-legallens}
      POSTGRES_USER: ${POSTGRES_USER:-legallens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legallens}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-legallens} -d ${POSTGRES_DB:-legallens}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      ai_engine:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      LEGAL_ENGINE_BASE_URL: ${LEGAL_ENGINE_BASE_URL:-http://ai_engine:8001}
      LEGAL_ENGINE_TIMEOUT: ${LEGAL_ENGINE_TIMEOUT:-20}
      POSTGRES_DB: ${POSTGRES_DB:-legallens}
      POSTGRES_USER: ${POSTGRES_USER:-legallens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-legallens}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
      - media-data:/app/media
      - static-data:/app/staticfiles
    expose:
      - "8000"

  ai_engine:
    build:
      context: .
      dockerfile: ai_engine/Dockerfile
    environment:
      LEGAL_LLM_PROVIDER: ${LEGAL_LLM_PROVIDER:-none}
      LEGAL_LLM_BASE_URL: ${LEGAL_LLM_BASE_URL:-http://ollama:11434}
      LEGAL_LLM_MODEL: ${LEGAL_LLM_MODEL:-llama3.1}
      LEGAL_LLM_API_KEY: ${LEGAL_LLM_API_KEY:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - .:/app
    expose:
      - "8001"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
      ai_engine:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - media-data:/var/www/media:ro
      - static-data:/var/www/static:ro

volumes:
  postgres-data:
  media-data:
  static-data:

